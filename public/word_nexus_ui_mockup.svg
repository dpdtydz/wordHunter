<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>

    <!-- Card Glow / Hologram -->
    <linearGradient id="holoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="33%" stop-color="#8b5cf6"/>
      <stop offset="66%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f1a3a"/>
      <stop offset="100%" stop-color="#0d0b1a"/>
    </linearGradient>

    <!-- Shiny Gold Glow -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Button Glow -->
    <linearGradient id="primaryBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Navbar / HUD Header -->
  <g transform="translate(24, 20)">
    <!-- App Logo -->
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#f8fafc" letter-spacing="2">WORD<tspan fill="#8b5cf6">NEXUS</tspan></text>
    
    <!-- Mode Badge -->
    <rect x="180" y="4" width="100" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <circle cx="194" cy="17" r="4" fill="#10b981"/>
    <text x="204" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">FARMING</text>

    <!-- Stats HUD -->
    <!-- Level Badge -->
    <rect x="490" y="4" width="100" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="502" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Lv. 12</text>
    <rect x="546" y="12" width="36" height="10" rx="5" fill="#0f172a"/>
    <rect x="546" y="12" width="24" height="10" rx="5" fill="#f59e0b"/>

    <!-- Gold -->
    <rect x="600" y="4" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="616" cy="17" r="6" fill="#fbbf24"/>
    <text x="616" y="21" font-family="sans-serif" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">🪙</text>
    <text x="630" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">1,450</text>

    <!-- Collection Progress -->
    <rect x="720" y="4" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="732" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc">📚 48 / 120</text>
  </g>

  <line x1="24" y1="62" x2="876" y2="62" stroke="#1e293b" stroke-width="1"/>

  <!-- Main Game Workspace -->
  <!-- Left Side: Character Card Preview -->
  <g transform="translate(32, 80)" filter="url(#cardShadow)">
    <!-- Outer Hologram Border -->
    <rect x="0" y="0" width="270" height="405" rx="16" fill="url(#holoBorder)" opacity="0.9"/>
    <!-- Card Inner -->
    <rect x="3" y="3" width="264" height="399" rx="14" fill="url(#cardBg)"/>

    <!-- Shiny Tag -->
    <rect x="16" y="16" width="76" height="22" rx="11" fill="url(#goldText)"/>
    <text x="54" y="31" font-family="sans-serif" font-size="11" font-weight="900" fill="#451a03" text-anchor="middle">✨ SHINY</text>

    <!-- Rarity Badge -->
    <rect x="150" y="16" width="98" height="22" rx="11" fill="#831843" stroke="#f43f5e" stroke-width="1"/>
    <text x="199" y="31" font-family="sans-serif" font-size="11" font-weight="800" fill="#fecdd3" text-anchor="middle">LEGENDARY</text>

    <!-- Character Avatar Frame -->
    <rect x="20" y="52" width="224" height="210" rx="10" fill="#0f172a" stroke="#3b0764" stroke-width="2"/>
    <!-- Illust Placeholder Art (Dragon Vector) -->
    <circle cx="132" cy="140" r="65" fill="#581c87" opacity="0.5" filter="url(#glow)"/>
    <path d="M 132 90 L 155 125 L 180 120 L 160 145 L 175 180 L 132 160 L 89 180 L 104 145 L 84 120 L 109 125 Z" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="122" cy="130" r="4" fill="#fef08a"/>
    <circle cx="142" cy="130" r="4" fill="#fef08a"/>

    <!-- Character Name & Info -->
    <text x="132" y="286" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="url(#goldText)" text-anchor="middle">ASTRONOMER</text>
    <text x="132" y="306" font-family="sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">천문학자 · 별의 관측자</text>

    <!-- Card Stats / Soul Level -->
    <rect x="20" y="322" width="224" height="62" rx="8" fill="#13112c" stroke="#2e1065" stroke-width="1"/>
    <text x="32" y="344" font-family="sans-serif" font-size="11" fill="#94a3b8">Soul Power:</text>
    <text x="100" y="344" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">9,420</text>
    <text x="160" y="344" font-family="sans-serif" font-size="11" fill="#94a3b8">Card Lv:</text>
    <text x="212" y="344" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f43f5e">MAX</text>

    <text x="32" y="368" font-family="sans-serif" font-size="10" fill="#64748b">"밤하늘의 별자리 속에 감춰진 고대 문명을 관측한다."</text>
  </g>

  <!-- Right Side: Word Guessing Game Board -->
  <g transform="translate(325, 80)">
    <!-- Category & Hint Header Panel -->
    <rect x="0" y="0" width="540" height="90" rx="12" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="20" y="28" font-family="sans-serif" font-size="12" font-weight="800" fill="#818cf8">CATEGORY: <tspan fill="#38bdf8">생명체 &amp; 지식인</tspan></text>
    <rect x="420" y="14" width="100" height="22" rx="6" fill="#065f46"/>
    <text x="470" y="29" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">HP: ♥♥♥♥♥</text>

    <text x="20" y="58" font-family="sans-serif" font-size="13" fill="#cbd5e1">AI HINT: <tspan fill="#f1f5f9" font-style="italic">"A scientist who studies stars, planets, and celestial bodies in space."</tspan></text>
    <text x="20" y="76" font-family="sans-serif" font-size="12" fill="#94a3b8">한글 뜻: 별과 우주를 연구하고 별자리의 운명을 읽어내는 학자</text>

    <!-- Word Letter Display Slots -->
    <g transform="translate(0, 110)">
      <!-- A -->
      <rect x="0" y="0" width="45" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="22.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#10b981" text-anchor="middle">A</text>

      <!-- S -->
      <rect x="52" y="0" width="45" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="74.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#10b981" text-anchor="middle">S</text>

      <!-- T -->
      <rect x="104" y="0" width="45" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="126.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#10b981" text-anchor="middle">T</text>

      <!-- R -->
      <rect x="156" y="0" width="45" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="178.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#10b981" text-anchor="middle">R</text>

      <!-- O -->
      <rect x="208" y="0" width="45" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="230.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#10b981" text-anchor="middle">O</text>

      <!-- N -->
      <rect x="260" y="0" width="45" height="55" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
      <text x="282.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#818cf8" text-anchor="middle">N</text>

      <!-- O -->
      <rect x="312" y="0" width="45" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="334.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#10b981" text-anchor="middle">O</text>

      <!-- M -->
      <rect x="364" y="0" width="45" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <line x1="379" y1="42" x2="394" y2="42" stroke="#64748b" stroke-width="3"/>

      <!-- E -->
      <rect x="416" y="0" width="45" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <line x1="431" y1="42" x2="446" y2="42" stroke="#64748b" stroke-width="3"/>

      <!-- R -->
      <rect x="468" y="0" width="45" height="55" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
      <text x="490.5" y="38" font-family="sans-serif" font-size="26" font-weight="900" fill="#10b981" text-anchor="middle">R</text>
    </g>

    <!-- Onscreen Keyboard Matrix -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="540" height="210" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b">KEYBOARD INPUT</text>

      <!-- Row 1: Q W E R T Y U I O P -->
      <g transform="translate(16, 38)">
        <!-- Q --> <rect x="0" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="22" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">Q</text>
        <!-- W --> <rect x="50" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="72" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">W</text>
        <!-- E --> <rect x="100" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="122" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">E</text>
        <!-- R --> <rect x="150" y="0" width="44" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/><text x="172" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">R</text>
        <!-- T --> <rect x="200" y="0" width="44" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/><text x="222" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">T</text>
        <!-- Y --> <rect x="250" y="0" width="44" height="42" rx="6" fill="#881337" opacity="0.6"/><text x="272" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fda4af" text-anchor="middle">Y</text>
        <!-- U --> <rect x="300" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="322" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">U</text>
        <!-- I --> <rect x="350" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="372" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">I</text>
        <!-- O --> <rect x="400" y="0" width="44" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/><text x="422" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">O</text>
        <!-- P --> <rect x="450" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="472" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">P</text>
      </g>

      <!-- Row 2: A S D F G H J K L -->
      <g transform="translate(40, 90)">
        <!-- A --> <rect x="0" y="0" width="44" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/><text x="22" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">A</text>
        <!-- S --> <rect x="50" y="0" width="44" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/><text x="72" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">S</text>
        <!-- D --> <rect x="100" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="122" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">D</text>
        <!-- F --> <rect x="150" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="172" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">F</text>
        <!-- G --> <rect x="200" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="222" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">G</text>
        <!-- H --> <rect x="250" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="272" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">H</text>
        <!-- J --> <rect x="300" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="322" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">J</text>
        <!-- K --> <rect x="350" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="372" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">K</text>
        <!-- L --> <rect x="400" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="422" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">L</text>
      </g>

      <!-- Row 3: Z X C V B N M -->
      <g transform="translate(90, 142)">
        <!-- Z --> <rect x="0" y="0" width="44" height="42" rx="6" fill="#881337" opacity="0.6"/><text x="22" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fda4af" text-anchor="middle">Z</text>
        <!-- X --> <rect x="50" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="72" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">X</text>
        <!-- C --> <rect x="100" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="122" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">C</text>
        <!-- V --> <rect x="150" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="172" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">V</text>
        <!-- B --> <rect x="200" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="222" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">B</text>
        <!-- N --> <rect x="250" y="0" width="44" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/><text x="272" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">N</text>
        <!-- M --> <rect x="300" y="0" width="44" height="42" rx="6" fill="#1e293b"/><text x="322" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#94a3b8" text-anchor="middle">M</text>
      </g>
    </g>
  </g>
</svg>
